<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page Speaker</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Page Speaker</h1>
    <button id="settingsToggle" title="Settings">⚙</button>
  </header>

  <section id="settingsPanel" class="hidden">
    <label>
      Anthropic API key
      <input type="password" id="anthropicKey" placeholder="sk-ant-..." />
    </label>
    <label>
      ElevenLabs API key
      <input type="password" id="elevenLabsKey" placeholder="..." />
    </label>
    <label>
      ElevenLabs voice ID <span class="hint">(optional, default: Rachel)</span>
      <input type="text" id="voiceId" placeholder="21m00Tcm4TlvDq8ikWAM" />
    </label>
    <button id="saveSettings">Save</button>
    <p class="settings-note">Keys are stored only in this browser's local extension storage. They're sent directly to Anthropic and ElevenLabs — never anywhere else.</p>
  </section>

  <main id="mainPanel">
    <button id="runBtn" class="run-button">
      <span class="run-icon">▶</span>
      <span id="runLabel">Summarize &amp; speak this page</span>
    </button>
    <p class="shortcut-hint">Shortcut: Ctrl+Shift+S</p>

    <div id="statusArea" class="hidden">
      <p id="statusText"></p>
      <div id="progressDots" class="progress-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="errorArea" class="hidden">
      <p id="errorText"></p>
    </div>

    <div id="resultArea" class="hidden">
      <div class="audio-controls">
        <button id="playPauseBtn">⏸ Pause</button>
        <button id="stopBtn">⏹ Stop</button>
      </div>
      <p id="summaryText" class="summary-text"></p>
    </div>
  </main>

  <audio id="audioPlayer"></audio>
  <script src="popup.js"></script>
</body>
</html>
