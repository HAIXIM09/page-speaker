<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stick Combat Pro | Ultimate Physics Fighting</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- UI Overlay -->
        <div id="ui-layer">
            <!-- HUD -->
            <div id="hud" class="hidden">
                <div class="player-stats p1">
                    <div class="name">PLAYER 1</div>
                    <div class="bar-container">
                        <div id="p1-health" class="bar health" style="width: 100%"></div>
                    </div>
                    <div class="bar-container mini">
                        <div id="p1-stamina" class="bar stamina" style="width: 100%"></div>
                    </div>
                    <div class="bar-container ultra">
                        <div id="p1-energy" class="bar energy" style="width: 0%"></div>
                    </div>
                </div>

                <div id="match-timer">99</div>

                <div class="player-stats p2">
                    <div class="name">AI OVERLORD</div>
                    <div class="bar-container">
                        <div id="p2-health" class="bar health" style="width: 100%"></div>
                    </div>
                    <div class="bar-container mini">
                        <div id="p2-stamina" class="bar stamina" style="width: 100%"></div>
                    </div>
                    <div class="bar-container ultra">
                        <div id="p2-energy" class="bar energy" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Main Menu -->
            <div id="main-menu" class="menu-screen">
                <div class="menu-content">
                    <h1 class="game-title">STICK COMBAT <span class="accent">PRO</span></h1>
                    <div class="menu-buttons">
                        <button id="to-select-btn" class="btn-premium">ENTER ARENA</button>
                        <button id="settings-btn" class="btn-premium secondary">SETTINGS</button>
                    </div>
                    <p class="menu-hint">CONTROL WITH WASD / ARROWS & SPACE</p>
                </div>
            </div>

            <!-- Character Selection -->
            <div id="char-selection" class="menu-screen hidden">
                <div class="menu-content">
                    <h2>SELECT FIGHTER</h2>
                    <div class="char-cards">
                        <div class="char-card selected" data-class="striker">
                            <div class="char-preview striker"></div>
                            <h3>STRIKER</h3>
                            <p>Balanced Combatant</p>
                        </div>
                        <div class="char-card" data-class="tank">
                            <div class="char-preview tank"></div>
                            <h3>TANK</h3>
                            <p>Heavy Hitter</p>
                        </div>
                        <div class="char-card" data-class="assassin">
                            <div class="char-preview assassin"></div>
                            <h3>ASSASSIN</h3>
                            <p>Swift Striker</p>
                        </div>
                    </div>
                    <button id="start-game-btn" class="btn-premium">FIGHT</button>
                    <button id="back-to-menu-from-sel-btn" class="btn-premium secondary">BACK</button>
                </div>
            </div>

            <!-- Results Screen -->
            <div id="results-screen" class="menu-screen hidden">
                <div class="menu-content">
                    <h2 id="winner-text">VICTORY</h2>
                    <div class="stats-summary">
                        <div class="stat-item">DAMAGE DEALT: <span id="stat-damage">0</span></div>
                        <div class="stat-item">MAX COMBO: <span id="stat-combo">0</span></div>
                    </div>
                    <button id="restart-btn" class="btn-premium">REMATCH</button>
                    <button id="back-to-menu-btn" class="btn-premium secondary">MAIN MENU</button>
                </div>
            </div>
            <!-- Settings Panel -->
            <div id="settings-panel" class="menu-screen hidden">
                <div class="menu-content">
                    <h2>SETTINGS</h2>
                    <div class="settings-list">
                        <div class="setting-item">
                            <label>AI DIFFICULTY</label>
                            <select id="ai-difficulty">
                                <option value="0.9">EASY</option>
                                <option value="0.5" selected>NORMAL</option>
                                <option value="0.2">HARDCORE</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label>MATCH TIME</label>
                            <input type="range" id="match-time-input" min="30" max="180" value="99">
                            <span id="time-val">99s</span>
                        </div>
                    </div>
                    <button id="settings-back-btn" class="btn-premium">BACK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
